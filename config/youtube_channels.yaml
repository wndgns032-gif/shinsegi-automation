# YouTube 채널 매핑 설정 (2026-10-07 로이 확정)
#
# ─────────────────────────────────────────────────────────────
# 핵심 원리
# ─────────────────────────────────────────────────────────────
# 이 프로젝트는 **언어별로 refresh token 이 분리**되어 있고,
# 각 token 은 **인증 시 선택한 채널에 고정(바인딩)** 된다.
# videos.insert 는 그 token 이 물려있는 채널에 업로드한다.
#
# → 즉 "어떤 언어를 어떤 채널에 올릴지"는 .env 의 토큰에 이미 반영되어 있다.
# → 채널을 바꾸려면 **해당 언어만 재인증**하면 된다. 코드를 바꿀 필요 없음.
#
# 이 파일은 그 매핑을 사람이 관리하기 쉽게 문서화하고,
# 인증 스크립트가 기대 채널을 여기서 읽는다 (하드코딩 금지).

# 채널 그룹 정의 — 계정 이메일이 아니라 '채널 핸들' 로 구분한다.
# 여러 언어가 같은 채널을 공유할 수 있다.
channels:
  brand:
    label: "shinsegimedia (브랜드 계정)"
    email: "shinsegimedia@gmail.com"
    handles:
      - "@shinsegi-fr"
      - "@shinsegi-zh"
  personal:
    label: "로이 개인 계정"
    email: "(로이 개인 Gmail)"
    handles:
      - "@WisdomPathroad"     # 한국어 채널 (2026-10-07 로이 확정)
      - "@wisdompath-en"      # 영어 채널 (2026-10-07 로이 확정)

# 언어 → 채널 그룹 매핑 (로이 확정: 2026-10-07, 저녁에 핸들 확정)
#   brand    = shinsegimedia → 프랑스어, 중국어
#   personal = 개인 계정    → 한국어, 영어
language_to_group:
  ko: personal      # 한국어 → @WisdomPathroad
  en: personal      # 영어   → @wisdompath-en
  fr: brand         # 프랑스어 → shinsegimedia
  zh-cn: brand      # 중국어   → shinsegimedia (@shinsegi-zh)

# 언어별 기대 핸들 — 인증 시 이 핸들이 아니면 토큰 저장을 거부한다.
# 2026-10-07 저녁: 기존 @shinsegi-kr 채널을 'shinsegi 中文' / @shinsegi-zh 로
#   개명/핸들 변경함 → zh-cn 기대 핸들 확정, ko 는 채널 재작성 후 확정
expected_handles:
  ko: "@WisdomPathroad"
  en: "@wisdompath-en"
  fr: "@shinsegi-fr"
  zh-cn: "@shinsegi-zh"

# 알려진 제약
# ─────────────────────────────────────────────────────────────
# 0. ⚠️ 2026-10-07 주의: 한국어 채널이 중국어로 바뀐 뒤, **기존 YOUTUBE_KO_REFRESH_TOKEN
#    이 @shinsegi-zh 를 가리킨다.** 이 상태로 한국어 영상을 올리면 중국어 채널에
#    한국어 영상이 올라간다. → 재인증 전까지 ko 업로드를 차단한다.
#    재인증 성공 시 blocked_languages 에서 자동으로 제거된다.
blocked_languages:
#    (기본 설정에서 '공개' 체크 필요).
