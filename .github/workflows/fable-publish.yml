# shinsegi 우화 쇼츠 발행 — 매일 KST 19:30 (UTC 10:30)
# 제작 자동화로 만들어진 영상을 IG 릴스 + YouTube 쇼츠로 업로드.
name: Fable Publish

on:
  schedule:
    - cron: '30 10 * * *'  # KST 19:30 매일
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fable-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TTS_ENGINE: edge
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      IG_KO_TOKEN: ${{ secrets.IG_KO_TOKEN }}
      IG_KO_USER_ID: ${{ secrets.IG_KO_USER_ID }}
      IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
      IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
      IG_ZH_CN_TOKEN: ${{ secrets.IG_ZH_CN_TOKEN }}
      IG_ZH_CN_USER_ID: ${{ secrets.IG_ZH_CN_USER_ID }}
      IG_FR_TOKEN: ${{ secrets.IG_FR_TOKEN }}
      IG_FR_USER_ID: ${{ secrets.IG_FR_USER_ID }}
      MASTODON_EN_TOKEN: ${{ secrets.MASTODON_EN_TOKEN }}
      MASTODON_KO_TOKEN: ${{ secrets.MASTODON_KO_TOKEN }}
      MASTODON_ZH_CN_TOKEN: ${{ secrets.MASTODON_ZH_CN_TOKEN }}
      MASTODON_FR_TOKEN: ${{ secrets.MASTODON_FR_TOKEN }}
      MASTODON_EN_BASE_URL: ${{ secrets.MASTODON_EN_BASE_URL }}
      MASTODON_KO_BASE_URL: ${{ secrets.MASTODON_KO_BASE_URL }}
      MASTODON_ZH_CN_BASE_URL: ${{ secrets.MASTODON_ZH_CN_BASE_URL }}
      MASTODON_FR_BASE_URL: ${{ secrets.MASTODON_FR_BASE_URL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_KO_REFRESH_TOKEN: ${{ secrets.YOUTUBE_KO_REFRESH_TOKEN }}
      YOUTUBE_FR_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FR_REFRESH_TOKEN }}
      IG_CARDS: off
      YOUTUBE_SHORTS: on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum fonts-wqy-zenhei fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify today's fable exists
        id: check
        run: |
          DATE=$(date +%Y-%m-%d)
          if [ ! -f "data/fables/$DATE/story.json" ]; then
            echo "오늘($DATE) story.json 없음 — 제작 자동화 미실행. 스킵."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish fable
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m src.main fable-publish
        continue-on-error: true   # YT 실패해도 IG 만 성공하면 워크플로우는 통과

      - name: Commit published marker
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add "data/fables/$(date +%Y-%m-%d)/published.json" 2>/dev/null || true
          git add data/youtube_uploads.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(markers): fable publish $(date +%Y-%m-%d) [skip ci]"
          git push || echo "nothing to push"
