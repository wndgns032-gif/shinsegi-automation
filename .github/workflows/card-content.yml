# shinsegi 카드뉴스 콘텐츠 발행 — KST 4회/일 (am/pm/ev/night)
# am=06:00 / pm=12:00 / ev=18:00 / night=23:00
# Threads/Bluesky/FB/Telegram/Mastodon/Pinterest (IG 제외 — 우화 쇼츠 전용)
name: Card Content

on:
  schedule:
    - cron: '0 21 * * *'   # KST 06:00 am (전날 21:00 UTC)
    - cron: '0 3 * * *'     # KST 12:00 pm
    - cron: '0 9 * * *'     # KST 18:00 ev
    - cron: '0 14 * * *'    # KST 23:00 night
  workflow_dispatch:
    inputs:
      cycle:
        description: 'am | pm | ev | night'
        required: false
        default: 'am'

permissions:
  contents: write

concurrency:
  group: card-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TTS_ENGINE: edge
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      IG_KO_TOKEN: ${{ secrets.IG_KO_TOKEN }}
      IG_KO_USER_ID: ${{ secrets.IG_KO_USER_ID }}
      IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
      IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
      IG_ZH_CN_TOKEN: ${{ secrets.IG_ZH_CN_TOKEN }}
      IG_ZH_CN_USER_ID: ${{ secrets.IG_ZH_CN_USER_ID }}
      IG_FR_TOKEN: ${{ secrets.IG_FR_TOKEN }}
      IG_FR_USER_ID: ${{ secrets.IG_FR_USER_ID }}
      MASTODON_EN_TOKEN: ${{ secrets.MASTODON_EN_TOKEN }}
      MASTODON_KO_TOKEN: ${{ secrets.MASTODON_KO_TOKEN }}
      MASTODON_ZH_CN_TOKEN: ${{ secrets.MASTODON_ZH_CN_TOKEN }}
      MASTODON_FR_TOKEN: ${{ secrets.MASTODON_FR_TOKEN }}
      MASTODON_EN_BASE_URL: ${{ secrets.MASTODON_EN_BASE_URL }}
      MASTODON_KO_BASE_URL: ${{ secrets.MASTODON_KO_BASE_URL }}
      MASTODON_ZH_CN_BASE_URL: ${{ secrets.MASTODON_ZH_CN_BASE_URL }}
      MASTODON_FR_BASE_URL: ${{ secrets.MASTODON_FR_BASE_URL }}
      FB_EN_PAGE_ID: ${{ secrets.FB_EN_PAGE_ID }}
      FB_FR_PAGE_ID: ${{ secrets.FB_FR_PAGE_ID }}
      FB_KO_PAGE_ID: ${{ secrets.FB_KO_PAGE_ID }}
      FB_ZH_CN_PAGE_ID: ${{ secrets.FB_ZH_CN_PAGE_ID }}
      META_USER_ID: ${{ secrets.META_USER_ID }}
      IG_CARDS: off
      YOUTUBE_SHORTS: on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum fonts-wqy-zenhei fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Determine cycle
        id: cycle
        run: |
          # 수동 트리거면 입력값 사용, 아니면 cron 시각 기반 추론
          INPUT="${{ github.event.inputs.cycle }}"
          if [ -n "$INPUT" ]; then
            echo "cycle=$INPUT" >> $GITHUB_OUTPUT
          else
            HOUR_UTC=$(date -u +%H)
            case $HOUR_UTC in
              21) CYCLE=am ;;
              03) CYCLE=pm ;;
              09) CYCLE=ev ;;
              14) CYCLE=night ;;
              *) CYCLE=am ;;
            esac
            echo "cycle=$CYCLE" >> $GITHUB_OUTPUT
          fi

      - name: Publish cycle
        run: |
          python -m src.main run-cycle --cycle ${{ steps.cycle.outputs.cycle }}

      - name: Commit markers
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add data/quotes_used.json data/youtube_uploads.json data/performance.xlsx 2>/dev/null || true
          git add "data/cards/$(date +%Y-%m-%d)/${{ steps.cycle.outputs.cycle }}/content.json" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(markers): content ${{ steps.cycle.outputs.cycle }} $(date +%Y-%m-%d) [skip ci]"
          git push || echo "nothing to push"
