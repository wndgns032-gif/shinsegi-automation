# shinsegi 우화 쇼츠 제작 — 매일 KST 17:33 (UTC 08:33)
# 로이 PC 가 꺼져도 GitHub runner 에서 자동 실행.
name: Fable Production

on:
  schedule:
    - cron: '33 8 * * *'   # KST 17:33 매일
  workflow_dispatch:        # 수동 트리거도 가능

permissions:
  contents: write           # 마커 커밋/푸시용

concurrency:
  group: fable-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TTS_ENGINE: edge       # 로컬 모델 없음 → 클라우드 edge-tts 강제
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
      # 시크릿 (Secrets 로 주입)
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      IG_KO_TOKEN: ${{ secrets.IG_KO_TOKEN }}
      IG_KO_USER_ID: ${{ secrets.IG_KO_USER_ID }}
      IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
      IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
      IG_ZH_CN_TOKEN: ${{ secrets.IG_ZH_CN_TOKEN }}
      IG_ZH_CN_USER_ID: ${{ secrets.IG_ZH_CN_USER_ID }}
      IG_FR_TOKEN: ${{ secrets.IG_FR_TOKEN }}
      IG_FR_USER_ID: ${{ secrets.IG_FR_USER_ID }}
      MASTODON_EN_TOKEN: ${{ secrets.MASTODON_EN_TOKEN }}
      MASTODON_KO_TOKEN: ${{ secrets.MASTODON_KO_TOKEN }}
      MASTODON_ZH_CN_TOKEN: ${{ secrets.MASTODON_ZH_CN_TOKEN }}
      MASTODON_FR_TOKEN: ${{ secrets.MASTODON_FR_TOKEN }}
      MASTODON_EN_BASE_URL: ${{ secrets.MASTODON_EN_BASE_URL }}
      MASTODON_KO_BASE_URL: ${{ secrets.MASTODON_KO_BASE_URL }}
      MASTODON_ZH_CN_BASE_URL: ${{ secrets.MASTODON_ZH_CN_BASE_URL }}
      MASTODON_FR_BASE_URL: ${{ secrets.MASTODON_FR_BASE_URL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_KO_REFRESH_TOKEN: ${{ secrets.YOUTUBE_KO_REFRESH_TOKEN }}
      YOUTUBE_FR_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FR_REFRESH_TOKEN }}
      IG_CARDS: off
      YOUTUBE_SHORTS: on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum fonts-wqy-zenhei fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Produce today's fable
        run: |
          python -m src.main run-fable --no-publish

      - name: Commit markers
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add data/quotes_used.json data/youtube_uploads.json data/performance.xlsx 2>/dev/null || true
          git add "data/fables/$(date +%Y-%m-%d)/story.json" 2>/dev/null || true
          git add "data/fables/$(date +%Y-%m-%d)/published.json" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(markers): fable production $(date +%Y-%m-%d) [skip ci]"
          git push || echo "nothing to push"
