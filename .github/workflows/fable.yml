# shinsegi 우화 쇼츠 — 하루 2회 발행 (KST 08:00 / 18:00)
#
# 로이 PC 가 꺼져도 GitHub runner 에서 자동 실행된다.
# 2026-10-08: 하루 1회(19:20) → 하루 2회(08:00, 18:00)로 변경 (로이 요청)
#
# 시간 계산 (GitHub cron 은 UTC):
#   KST 08:00 = UTC 23:00 (전날)
#   KST 18:00 = UTC 09:00
# minute 는 0 을 피한다 — ':00' 은 GitHub 스케줄러가 가장 혼잡해
# 실행이 대량 폐기(drop)된다. 공식 권장: 17 / 23 / 37 / 43.
name: Fable Production

on:
  schedule:
    # 하루 3편 (2026-10-10 로이 확정) — KST 00:07 / 08:07 / 16:07
    # kind 로 어떤 편인지 구분한다.
    #   midnight → 명언 우화 (기존)
    #   morning  → 나스닥 시총 TOP 10 성공이유
    #   afternoon→ 사업가 마인드
    - cron: '7 16 * * *'   # KST 00:07 (UTC 16:07 전날)
    - cron: '7 23 * * *'   # KST 08:07 (UTC 23:07 전날)
    - cron: '7 7 * * *'    # KST 16:07 (UTC 07:07)
  workflow_dispatch:
    inputs:
      kind:
        description: 'fable=명언우화 / stocks=나스닥TOP10 / biz=사업가마인드'
        required: false
        default: 'fable'
        type: choice
        options:
          - 'fable'
          - 'stocks'
          - 'biz'
      no_publish:
        description: 'true 면 제작만(미발행) — 테스트용. 기본 false(발행).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      date:
        description: '대상 날짜(YYYY-MM-DD). 비우면 오늘(KST).'
        required: false
  # private + 무료 계정 환경에서 schedule 이 비활성화될 때의 우회책.
  #   curl -X POST -H "Authorization: token $PAT" \
  #        -H "Accept: application/vnd.github+json" \
  #        https://api.github.com/repos/wndgns032-gif/shinsegi-automation/dispatches \
  #        -d '{"event_type":"daily-fable"}'
  repository_dispatch:
    types: [daily-fable, retry-fable]

permissions:
  contents: write           # 마커 커밋/푸시용

concurrency:
  # 하루 3편이므로 슬롯별로 분리해 서로 대기시키지 않게 한다.
  # (직렬로 쌓이면 하루치 작업이 다음 슬롯에 밀려 연쇄 지연이 난다)
  group: fable-production-${{ github.event.inputs.kind || github.run_id }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    # 2026-10-09 실측: 이미지 10장 생성에 최대 14분(851초) 걸린다.
    #   Pollinations 402 쿼터 회복 대기(20초×4회)가 반복되기 때문.
    #   + TTS 4개 언어 + 렌더 4개가 더해지면 40분은 부족할 수 있다.
    #   → 90분으로 여유를 둔다.
    timeout-minutes: 90
    env:
      TTS_ENGINE: edge       # 로컬 모델 없음 → 클라우드 edge-tts 강제
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      IG_KO_TOKEN: ${{ secrets.IG_KO_TOKEN }}
      IG_KO_USER_ID: ${{ secrets.IG_KO_USER_ID }}
      IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
      IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
      IG_ZH_CN_TOKEN: ${{ secrets.IG_ZH_CN_TOKEN }}
      IG_ZH_CN_USER_ID: ${{ secrets.IG_ZH_CN_USER_ID }}
      IG_FR_TOKEN: ${{ secrets.IG_FR_TOKEN }}
      IG_FR_USER_ID: ${{ secrets.IG_FR_USER_ID }}
      MASTODON_EN_TOKEN: ${{ secrets.MASTODON_EN_TOKEN }}
      MASTODON_KO_TOKEN: ${{ secrets.MASTODON_KO_TOKEN }}
      MASTODON_ZH_CN_TOKEN: ${{ secrets.MASTODON_ZH_CN_TOKEN }}
      MASTODON_FR_TOKEN: ${{ secrets.MASTODON_FR_TOKEN }}
      MASTODON_EN_BASE_URL: ${{ secrets.MASTODON_EN_BASE_URL }}
      MASTODON_KO_BASE_URL: ${{ secrets.MASTODON_KO_BASE_URL }}
      MASTODON_ZH_CN_BASE_URL: ${{ secrets.MASTODON_ZH_CN_BASE_URL }}
      MASTODON_FR_BASE_URL: ${{ secrets.MASTODON_FR_BASE_URL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_KO_REFRESH_TOKEN: ${{ secrets.YOUTUBE_KO_REFRESH_TOKEN }}
      YOUTUBE_FR_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FR_REFRESH_TOKEN }}
      # 2026-10-07 채널 재배치로 추가 (개인 계정 = ko/en, shinsegimedia = fr/zh)
      YOUTUBE_ZH_CN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ZH_CN_REFRESH_TOKEN }}
      YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
      IG_CARDS: off
      YOUTUBE_SHORTS: on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system deps
        run: |
          # 2026-10-08 실측 2건:
          #   1) apt-get 이 30분 이상 멈췄다 (runner 저장소 지연)
          #   2) 20분째 여전히 같은 단계
          # → **timeout 을 걸어** 정체를 무한 대기로 만들지 않는다.
          # → ubuntu:24.04 에는 ffmpeg 가 기본 설치돼 있어 apt 실패해도 진행 가능.
          set +e
          timeout 180 sudo apt-get update -qq 2>/dev/null
          timeout 240 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends \
            fonts-noto-cjk fonts-nanum fonts-wqy-zenhei fonts-dejavu-core 2>/dev/null
          RC=$?
          set -e
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "[warn] ffmpeg 미설치 (apt rc=$RC) — 2차 시도"
            timeout 180 sudo apt-get install -y ffmpeg 2>/dev/null || true
          fi
          ffmpeg -version 2>/dev/null | head -1 || echo "[warn] ffmpeg 없음 (렌더 불가)"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Decide target date and mode
        id: plan
        run: |
          # TZ=Asia/Seoul 이므로 date 는 KST 기준
          TODAY="$(date +%Y-%m-%d)"
          TARGET="${{ inputs.date }}"
          [ -z "$TARGET" ] && TARGET="$TODAY"

          # 장르 판별 (2026-10-10) — dispatch 의 inputs.kind 우선,
          # cron 이면 현재 KST 시각으로 슬롯을 판단한다.
          KIND="${{ inputs.kind }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -z "$KIND" ] && KIND="fable"
          else
            # cron 지연이 최대 수 시간 있어 ±3시간 창으로 판별한다.
            H=$(date +%-H)
            case "$H" in
              21|22|23|0|1) KIND="fable" ;;      # KST 00:07 슬롯
              6|7|8|9|10)   KIND="stocks" ;;     # KST 08:07 슬롯
              *)            KIND="biz" ;;        # KST 16:07 슬롯
            esac
          fi

          # workflow_dispatch + no_publish=true 면 제작만
          MODE="publish"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.no_publish }}" = "true" ]; then
            MODE="no-publish"
          fi
          echo "today=$TODAY"    >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"  >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"      >> "$GITHUB_OUTPUT"
          echo "kind=$KIND"      >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"
          echo "---"
          echo "KST today : $TODAY"
          echo "target    : $TARGET"
          echo "kind      : $KIND"
          echo "mode      : $MODE"
          echo "event     : ${{ github.event_name }}"

      - name: Produce & publish fable
        run: |
          KIND="${{ steps.plan.outputs.kind }}"
          KIND_ARG=""
          if [ "$KIND" != "fable" ]; then
            KIND_ARG="--kind $KIND"
          fi
          if [ "${{ steps.plan.outputs.mode }}" = "no-publish" ]; then
            echo "mode: produce only (test), kind=$KIND"
            python -m src.main run-fable --date "${{ steps.plan.outputs.target }}" \
              --no-publish $KIND_ARG
          else
            echo "mode: produce + publish, kind=$KIND"
            python -m src.main run-fable --date "${{ steps.plan.outputs.target }}" \
              $KIND_ARG
          fi

      - name: Commit markers
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add data/quotes_used.json data/youtube_uploads.json data/performance.xlsx 2>/dev/null || true
          git add data/source_log.xlsx data/error_log.jsonl 2>/dev/null || true
          git add "data/fables/${{ steps.plan.outputs.target }}/" 2>/dev/null || true
          # 장르가 붙으면 날짜 폴더에 suffix 가 붙는다 (예: 2026-10-17-stocks)
          K="${{ steps.plan.outputs.kind }}"
          if [ "$K" != "fable" ]; then
            git add "data/fables/${{ steps.plan.outputs.target }}-$K/" 2>/dev/null || true
            git add -f "data/fables/${{ steps.plan.outputs.target }}-$K/credits.jsonl" 2>/dev/null || true
          else
            git add -f "data/fables/${{ steps.plan.outputs.target }}/credits.jsonl" 2>/dev/null || true
          fi
          git diff --staged --quiet \
            || git commit -m "chore(markers): fable ${{ steps.plan.outputs.target }} ($K) [skip ci]"
          # 2026-10-08 실측: 수동 실행 중 로이가 push 하면 non-fast-forward 로 실패한다.
          # → 로컬 커밋을 먼저 받아 합친 뒤 push 한다(rebase).
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || echo "nothing to push"