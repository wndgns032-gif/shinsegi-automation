# shinsegi 우화 쇼츠 — 매일 KST 19:20 (UTC 10:20) 제작+발행
# 로이 PC 가 꺼져도 GitHub runner 에서 자동 실행.
# 2026-10-06: fable-publish.yml 을 합침 — 같은 runner 에서 mp4 를 그대로 발행에 써야 함(.gitignore 로 인해 mp4 가 커밋되지 않으므로 분리 불가).
name: Fable Production

on:
  schedule:
    # KST 19:20 (UTC 10:20) 마다 실행.
    # minute 를 20 → 17 로 바꾼 이유: GitHub Actions cron 스케줄러는
    # ':00' / ':30' 이 사람이 몰려 스케줄이 대량 지연·폐기(drop)된다.
    # 공식 권장: 17 / 23 / 37 / 43 같은 어중간한 분을 쓸 것.
    # (2026-10-07 실측: 20분 슬롯이 하루종일 실행되지 않음 — private+무료 한계도 별도 원인)
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      no_publish:
        description: 'true 면 제작만(미발행) — 테스트용. 기본 false(정시=발행).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # private + 무료 계정 환경에서 schedule 이벤트가 비활성화될 때의 우회책.
  # 로이 PC 의 자동화(WorkBuddy)가 KST 19:20 에 이걸 호출한다.
  # →cron 안 돌아도 발행이 계속된다.
  # 사용: curl -X POST -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
  #        https://api.github.com/repos/wndgns032-gif/shinsegi-automation/dispatches \
  #        -d '{"event_type":"daily-fable"}'
  repository_dispatch:
    types: [daily-fable, retry-fable]

permissions:
  contents: write           # 마커 커밋/푸시용

concurrency:
  group: fable-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TTS_ENGINE: edge       # 로컬 모델 없음 → 클라우드 edge-tts 강제
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
      # 시크릿 (Secrets 로 주입)
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      IG_KO_TOKEN: ${{ secrets.IG_KO_TOKEN }}
      IG_KO_USER_ID: ${{ secrets.IG_KO_USER_ID }}
      IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
      IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
      IG_ZH_CN_TOKEN: ${{ secrets.IG_ZH_CN_TOKEN }}
      IG_ZH_CN_USER_ID: ${{ secrets.IG_ZH_CN_USER_ID }}
      IG_FR_TOKEN: ${{ secrets.IG_FR_TOKEN }}
      IG_FR_USER_ID: ${{ secrets.IG_FR_USER_ID }}
      MASTODON_EN_TOKEN: ${{ secrets.MASTODON_EN_TOKEN }}
      MASTODON_KO_TOKEN: ${{ secrets.MASTODON_KO_TOKEN }}
      MASTODON_ZH_CN_TOKEN: ${{ secrets.MASTODON_ZH_CN_TOKEN }}
      MASTODON_FR_TOKEN: ${{ secrets.MASTODON_FR_TOKEN }}
      MASTODON_EN_BASE_URL: ${{ secrets.MASTODON_EN_BASE_URL }}
      MASTODON_KO_BASE_URL: ${{ secrets.MASTODON_KO_BASE_URL }}
      MASTODON_ZH_CN_BASE_URL: ${{ secrets.MASTODON_ZH_CN_BASE_URL }}
      MASTODON_FR_BASE_URL: ${{ secrets.MASTODON_FR_BASE_URL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_KO_REFRESH_TOKEN: ${{ secrets.YOUTUBE_KO_REFRESH_TOKEN }}
      YOUTUBE_FR_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FR_REFRESH_TOKEN }}
      # 2026-10-07 채널 재배치로 추가 (개인 계정 = ko/en, shinsegimedia = fr/zh)
      YOUTUBE_ZH_CN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ZH_CN_REFRESH_TOKEN }}
      YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
      IG_CARDS: off
      YOUTUBE_SHORTS: on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-nanum fonts-wqy-zenhei fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Produce & publish today's fable
        env:
          # schedule / repository_dispatch 로 들어온 실행은 항상 발행.
          # workflow_dispatch 는 no_publish 입력이 있을 때만 테스트로 본다.
          NO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.no_publish == 'true' && 'yes' || '' }}
        run: |
          # NO_PUBLISH=yes 면 제작만, 아니면 제작+발행
          if [ -n "$NO_PUBLISH" ]; then
            echo "mode: no-publish (테스트)"
            python -m src.main run-fable --no-publish
          else
            echo "mode: produce + publish  (event=${{ github.event_name }})"
            python -m src.main run-fable
          fi

      - name: Commit markers
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add data/quotes_used.json data/youtube_uploads.json data/performance.xlsx 2>/dev/null || true
          git add "data/fables/$(date +%Y-%m-%d)/story.json" 2>/dev/null || true
          git add "data/fables/$(date +%Y-%m-%d)/published.json" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(markers): fable production $(date +%Y-%m-%d) [skip ci]"
          git push || echo "nothing to push"
